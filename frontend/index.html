<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thumbnail Generator</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --fg: #1a1a1a;
    --card: #ffffff;
    --border: #e0e0e0;
    --accent: #4f46e5;
    --accent-fg: #ffffff;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    justify-content: center;
    padding: 3rem 1rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    max-width: 480px;
    width: 100%;
  }
  h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
  p.sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.9rem; }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .dropzone.dragover { border-color: var(--accent); }
  .dropzone input { display: none; }
  button {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.2rem;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 1rem;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { margin-top: 1rem; font-size: 0.9rem; color: var(--muted); }
  .error { color: #dc2626; }
  .result { margin-top: 1.5rem; text-align: center; }
  .result img {
    max-width: 200px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Thumbnail generator</h1>
    <p class="sub">Upload an image (PNG, JPEG, GIF, or WebP). The backend will resize it to 200&times;200 automatically.</p>

    <div class="dropzone" id="dropzone">
      <p id="dropzoneLabel">Click to choose a file, or drag one here</p>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp" />
    </div>

    <button id="uploadBtn" disabled>Upload</button>

    <div class="status" id="status"></div>
    <div class="result" id="result"></div>
  </div>

  <script>
    // Set at deploy time (see deploy.sh / Terraform output) or edit directly.
    const UPLOAD_FUNCTION_URL = "__GET_UPLOAD_URL_ENDPOINT__";

    /** @type {HTMLInputElement} */
    const fileInput = document.getElementById("fileInput");
    const dropzone = document.getElementById("dropzone");
    const dropzoneLabel = document.getElementById("dropzoneLabel");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    /** @type {File | null} */
    let selectedFile = null;

    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      if (e.dataTransfer && e.dataTransfer.files.length > 0) {
        handleFileSelected(e.dataTransfer.files[0]);
      }
    });
    fileInput.addEventListener("change", () => {
      if (fileInput.files && fileInput.files.length > 0) {
        handleFileSelected(fileInput.files[0]);
      }
    });

    /** @param {File} file */
    function handleFileSelected(file) {
      selectedFile = file;
      dropzoneLabel.textContent = `Selected: ${file.name}`;
      uploadBtn.disabled = false;
      resultEl.innerHTML = "";
      statusEl.textContent = "";
      statusEl.classList.remove("error");
    }

    uploadBtn.addEventListener("click", async () => {
      if (!selectedFile) return;
      uploadBtn.disabled = true;
      resultEl.innerHTML = "";
      statusEl.classList.remove("error");

      try {
        statusEl.textContent = "Requesting upload URL...";
        const uploadUrlResp = await fetch(`${UPLOAD_FUNCTION_URL}?action=upload`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            filename: selectedFile.name,
            contentType: selectedFile.type,
          }),
        });
        if (!uploadUrlResp.ok) {
          throw new Error(`Failed to get upload URL: ${uploadUrlResp.status}`);
        }
        const { uploadUrl, objectName } = await uploadUrlResp.json();

        statusEl.textContent = "Uploading image...";
        const putResp = await fetch(uploadUrl, {
          method: "PUT",
          headers: { "Content-Type": selectedFile.type },
          body: selectedFile,
        });
        if (!putResp.ok) {
          throw new Error(`Upload failed: ${putResp.status}`);
        }

        statusEl.textContent = "Waiting for thumbnail to be generated...";
        const downloadUrl = await pollForThumbnail(objectName);

        statusEl.textContent = "Done!";
        resultEl.innerHTML = `<img src="${downloadUrl}" alt="Thumbnail" />`;
      } catch (err) {
        statusEl.textContent = err instanceof Error ? err.message : String(err);
        statusEl.classList.add("error");
      } finally {
        uploadBtn.disabled = false;
      }
    });

    /**
     * @param {string} objectName
     * @returns {Promise<string>}
     */
    async function pollForThumbnail(objectName) {
      const maxAttempts = 20;
      const delayMs = 1500;

      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const resp = await fetch(
          `${UPLOAD_FUNCTION_URL}?action=download&objectName=${encodeURIComponent(objectName)}`
        );
        if (resp.ok) {
          const data = await resp.json();
          if (data.exists) {
            return data.downloadUrl;
          }
        }
        await new Promise((resolve) => setTimeout(resolve, delayMs));
      }
      throw new Error("Timed out waiting for thumbnail.");
    }
  </script>
</body>
</html>
